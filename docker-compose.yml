version: "3.8"

services:
  # Streamlit Interactive Dashboard
  ui:
    build: .
    container_name: docuai-ui
    ports:
      - "8501:8501"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - CHROMA_PERSIST_DIR=/app/data/chroma_db
    volumes:
      - ./data:/app/data
    restart: unless-stopped

  # Decoupled FastAPI Backend REST Server
  api:
    build: .
    container_name: docuai-api
    command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
    ports:
      - "8000:8000"
    environment:
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY:-}
      - CHROMA_PERSIST_DIR=/app/data/chroma_db
    volumes:
      - ./data:/app/data
    restart: unless-stopped
